ace \"Sky.\" Evening passed, then morning came—day two.\n**9** Then God said, \"Let the water under the sky gather into one place so dry ground can appear.\" And it happened.\n**10** God named the dry ground \"Land\" and the gathered water \"Oceans.\" And God saw that it was good.\n**11** Then God said, \"Let the land sprout all kinds of plants—seed-bearing plants and fruit trees with seeds inside their fruit, each reproducing after its own kind.\" And it happened.\n**12** The land produced greenery: seed-bearing plants and fruit trees, each according to its kind. And God saw that it was good.\n**13** Evening passed, then morning came—day three.\n**14** Then God said, \"Let there be lights in the sky to separate day from night, and to mark seasons, days, and years,\n**15** shining down on the earth.\" And it happened.\n**16** God made two major lights—the brighter one to govern the day, the dimmer one to govern the night—along with the stars.\n**17** He placed them in the sky to light up the earth,\n**18** to govern day and night, and to separate light from darkness. And God saw that it was good.\n**19** Evening passed, then morning came—day four.\n**20** Then God said, \"Let the waters teem with living creatures, and let birds fly above the earth across the open sky.\"\n**21** So God created the giant sea creatures and every living thing that swarms in the water, each according to its kind, along with every winged bird. And God saw that it was good.\n**22** God blessed them: \"Reproduce, multiply, and fill the oceans, and let birds multiply across the earth.\"\n**23** Evening passed, then morning came—day five.\n**24** Then God said, \"Let the land produce living creatures of every kind: livestock, crawling creatures, and wild animals.\" And it happened.\n**25** God made the wild animals, the livestock, and everything that crawls on the ground, each according to its kind. And God saw that it was good.\n**26** Then God said, \"Let us make humanity in our image, to be like us. Let them rule over the fish in the sea, the birds in the sky, the livestock, all the earth, and every creature that crawls on it.\"\n**27** So God created humanity in his own image—in the image of God he created them, male and female.\n**28** God blessed them and told them, \"Have children, multiply, fill the earth, and take care of it. Rule over the fish, the birds, and every living creature that moves on the earth.\"\n**29** God also said, \"Look, I've given you every seed-bearing plant on the whole earth and every tree with seed-bearing fruit—all of it is yours for food.\n**30** And for every wild animal, every bird, and every creature that crawls on the earth—everything with breath in it—I've given every green plant for food.\" And it happened.\n**31** God looked over everything he had made, and it was deeply, wonderfully good. Evening passed, then morning came—day six.\n\n---", "Crossings & Lexical Notes": "- **v. 1 `בְּרֵאשִׁית` (*bereshit*):** \"In [the] beginning\" or \"When God began to create...\" (construct state).\n- **v. 1 `אֱלֹהִים` (*Elohim*):** Plural form used with singular verbs for the one God, conveying majesty/fullness.\n- **v. 2 `תֹהוּ וָבֹהוּ` (*tohu va-bohu*):** \"Formless and void,\" \"wild and waste,\" \"unformed and unfilled.\"\n- **v. 2 `רוּחַ אֱלֹהִים` (*ruach Elohim*):** *Ruach* spans \"Spirit,\" \"wind,\" and \"breath.\"\n- **v. 6 `רָקִיעַ` (*raqia*):** \"Expanse,\" \"dome,\" \"firmament\" (from *raqa*, to beat/spread out).\n- **v. 26 `אָדָם` (*adam*):** \"Humankind,\" \"humanity,\" \"man\" (collective noun here, not yet a personal name).\n- **v. 26 `צֶלֶם` (*tselem*) & `דְּמוּת` (*demut*):** \"Image\" (statue/representation) and \"likeness\" (resemblance).\n\n---", "Supplemental Texts & Allusions": "- **John 1:1–3** (echoes Gen 1:1): *\"In the beginning was the Word, and the Word was with God, and the Word was God. He was in the beginning with God. All things were made through him, and without him was not any thing made tha  in-his-wife, and-they-shall-become to-flesh one.\n**25** And-were both-of-them naked *(arumim)*, the-human and-his-wife, and-not were-ashamed.\n\n---", "Clear & Faithful": "**1** Thus the heavens and the earth were finished, and all their host.\n**2** On the seventh day God finished his work that he had done, and he rested on the seventh day from all his work that he had done.\n**3** So God blessed the seventh day and made it holy, because on it God rested from all his work that he had done in creation.\n**4** These are the generations of the heavens and the earth when they were created, in the day that the LORD God made the earth and the heavens.\n**5** When no bush of the field was yet in the land and no small plant of the field had yet sprung up—for the LORD God had not caused it to rain on the land, and there was no man to work the ground,\n**6** and a mist was going up from the land and watering the whole face of the ground—\n**7** then the LORD God formed the man of dust from the ground and breathed into his nostrils the breath of life, and the man became a living creature.\n**8** And the LORD God planted a garden in Eden, in the east, and there he put the man whom he had formed.\n**9** And out of the ground the LORD God made to spring up every tree that is pleasant to the sight and good for food. The tree of life was in the midst of the garden, and the tree of the knowledge of good and evil.\n**10** A river flowed out of Eden to water the garden, and there it divided and became four rivers.\n**11** The name of the first is the Pishon. It is the one that flowed around the whole land of Havilah, where there is gold.\n**12** And the gold of that land is good; bdellium and onyx stone are there.\n**13** The name of the second river is the Gihon. It is the one that flowed around the whole land of Cush.\n**14** The name of the third river is the Tigris, which flows east of Assyria. And the fourth river is the Euphrates.\n**15** The LORD God took the man and put him d up from the ground to soak the surface—\n**7** the LORD God shaped the human out of dust from the ground and breathed the breath of life into his nostrils, and the human became a living being.\n**8** Then the LORD God planted a garden in Eden, in the east, and placed the human he had shaped there.\n**9** God made all kinds of trees grow out of the ground—trees that were beautiful to look at and great for food—along with the tree of life in the middle of the garden, and the tree of knowing good and evil.\n**10** A river flowed out of Eden to water the garden, and from there it split into four branches:\n**11** The first is the Pishon, which winds through the whole land of Havilah, where there's gold\n**12** (and the gold there is high quality, along with aromatic resin and onyx).\n**13** The second river is the Gihon, winding through the whole land of Cush.\n**14** The third is the Tigris, running east of Assyria. And the fourth is the Euphrates.\n**15** The LORD God placed the human in the garden of Eden to tend it and care for it,\n**16** and gave him this command: \"You're free to eat from any tree in the garden,\n**17** except the tree of knowing good and evil. Don't eat from that one—because the day you eat from it, you will definitely die.\"\n**18** Then the LORD God said, \"It isn't good for the human to be alone. I'll make a partner who truly corresponds to him.\"\n**19** Out of the ground, the LORD God had formed every wild animal and every bird, and he brought them to the human to see what he'd name them. Whatever the human called each living creature became its name.\n**20** So the human named all the livestock, the birds, and the wild animals—but none of them was a true partner for him.\n**21** So the LORD God put the human into a deep sleep, took one of his ribs (or sides) while he slept, and closed the flesh back up.\n**22** From that rib, the LORD God fashioned a woman and brought her to the human.\n**23** The human exclaimed, \"At last! This is bone from my bones and flesh from my flesh! She'll be called Woman, because she was taken out of Man.\"\n**24** That's why a man leaves his father and mother and bonds with his wife, and the two become one flesh.\n**25** Both the man and his wife were naked, and they felt no shame at all.\n\n---", "Crossings & Lexical Notes": "- **v. 2 `שָׁבַת` (*shavat*):** \"Rested,\" \"ceased\" (root of *Sabbath*).\n- **v. 7 `יָצַר` (*yatsar*):** \"Formed,\" \"shaped\" (like a potter shaping clay).\n- **v. 7 `אָדָם` (*adam*) & `אֲדָמָה` (*adamah*):** Wordplay between *adam* (human) and *adamah* (ground/soil)—\"earthling from the earth.\"\n- **v. 18 `עֵזֶר כְּנֶגְדּוֹ` (*ezer kenegdo*):** \"A helper corresponding to him,\" \"a partner fit for him\" (*ezer* is used elsewhere in the OT for God as rescuer/ally, not a subordinate).\n- **v. 21 `צֵלָע` (*tsela*):** \"Rib\" or \"side.\"\n- **v. 23 `אִשָּׁה` (*ishah*) & `אִישׁ` (*ish*):** Wordplay between *ishah* (woman) and *ish* (man).\n\n---", "Supplemental Texts & Allusions": "- **Exodus 20:11** (cites Gen 2:2–3): *\"For in six days the LORD made heaven and earth, the sea, and all that is in them, and rested on the seventh day. Therefore the LORD blessed the Sabbath day and made it holy.\"*\n- **Hebrews 4:4** (cites Gen 2:2): *\"For he has somewhere spoken of the seventh day in this way: 'And God rested on the seventh day from all his works.'\"*\n- **1 Corinthians 15:45** (cites Gen 2:7): *\"Thus it is written, 'The first man Adam became a living being'; the last Adam became a life-giving spirit.\"*\n- **Matthew 19:5 / Mark 10:7–8 / Ephesians 5:31** (cites Gen 2:24): *\"Therefore a man shall leave his father and his mother and hold fast to his wife, and the two shall become one flesh.\"*"}}, {"id": "genesis-03", "book": "Genesis", "chapter": "3", "title": "Genesis 3", "sections": {"Word-for-Word": "**1** And-the-serpent *(nachash)* was shrewd *(arum)* from-every living-thing-of the-field which had-made YHWH God. And-he-said to the-woman: eat of the fruit of the tree that is in the midst of the garden, neither shall you touch it, lest you die.'\"\n**4** But the serpent said to the woman, \"You will not surely die.\n**5** For God knows that when you eat of it your eyes will be opened, and you will be like God, knowing good and evil.\"\n**6** So when the woman saw that the tree was good for food, and that it was a delight to the eyes, and that the tree was to be desired to make one wise, she took of its fruit and ate, and she also gave some to her husband who was with her, and he ate.\n**7** Then the eyes of both were opened, and they knew that they were naked. And they sewed fig leaves together and made themselves loincloths.\n**8** And they heard the sound of the LORD God walking in the garden in the cool of the day, and the man and his wife hid themselves from the presence of the LORD God among the trees of the garden.\n**9** But the LORD God called to the man and said to him, \"Where are you?\"\n**10** And he said, \"I heard the sound of you in the garden, and I was afraid, because I was naked, and I hid myself.\"\n**11** He said, \"Who told you that you were naked? Have you eaten of the tree of which I commanded you not to eat?\"\n**12** The man said, \"The woman whom you gave to be with me, she gave me fruit of the tree, and I ate.\"\n**13** Then the LORD God said to the woman, \"What is this that you have done?\" The woman said, \"The serpent deceived me, and I ate.\"\n**14** The LORD God said to the serpent, \"Because you have done this, cursed are you above all livestock and above all beasts of the field; on your belly you shall go, and dust you shall eat all the days of your life.\n**15** I will put enmity between you and the woman, and between your offspring and her offspring; he shall bruise your head, and you shall bruise his heel.\"\n**16** To the woman he said, \"I will surely multiply your pain in childbearing; in pain you shall bring forth children. Your desire shall be contrary to your husband, but he shall rule over you.\"\n**17** And to Adam he said, \"Because you have listened to the voice of your wife and have eaten of the tree of which I commanded you, 'You shall not eat of it,' cursed is the ground because of you; in pain you shall eat of it all the days of your life;\n**18** thorns and thistles it shall bring forth for you; and you shall eat the plants of the field.\n**19** By the sweat of your face you shall eat bread, till you return to the ground, for out of it you were taken; for you are dust, and to dust you shall return.\"\n**20** The man called his wife's name Eve, because she was the mother of all living.\n**21** And the LORD God made for Adam and for his wife garments of skins and clothed them.\n**22** Then the LORD God said, \"Behold, the man has become like one of us in knowing good and evil. Now, lest he reach out his hand and take also of the tree of life and eat, and live forever—\"\n**23** therefore the LORD God sent him out from the garden of Eden to work the ground from which he was taken.\n**24** He drove out the man, and at the east of the garden of Eden he placed the cherubim and a flaming sword that turned every way to guard the way to the tree of life.\n\n---", "Everyday English": "**1** Now the snake was shrewder than any other wild animal the LORD God had made. It asked the woman, \"Did God really say, 'You can't eat from any tree in the garden'?\"\n**2** The woman answered, \"We can eat fruit from the trees in the garden,\n**3** except for the tree in the middle of the garden. God said, 'Don't eat from it and don't even touch it, or you'll die.'\"\n**4** \"You won't die!\" the snake told her.\n**5** \"God knows that the moment you eat from it, your eyes will open and you'll be just like God, knowing good and evil.\"\n**6** The woman looked at the tree—the fruit looked good to eat, beautiful to look at, and promising wisdom. So she picked some and ate it, and she gave some to her husband who was right there with her, and he ate it too.\n**7** Immediately, both of their eyes opened, and they realized they were naked. So they stitched fig leaves together to cover themselves.\n**8** Later, in the evening breeze, they heard the LORD God walking through the garden, and the man and his wife hid from him among the trees.\n**9** The LORD God called out to the man, \"Where are you?\"\n**10** He answered, \"I heard you in the garden, and I was scared because I'm naked, so I hid.\"\n**11** \"Who told you that you were naked?\" God asked. \"Did you eat from the tree I told you not to eat from?\"\n**12** The man replied, \"The woman you put here with me—she gave me the fruit, and I ate it.\"\n**13** Then the LORD God asked the woman, \"What have you done?\" She said, \"The snake tricked me, and I ate it.\"\n**14** So the LORD God said to the snake: \"Because you did this, you're cursed above all livestock and wild animals. You'll crawl on your belly and eat dust for the rest of your life.\n**15** I'm putting hostility between you and the woman, and between your offspring and hers. He will crush your head, and you will strike his heel.\"\n**16** To the woman he said: \"I will greatly increase your pain in pregnancy and childbirth; you'll give birth in pain. You'll desire your husband, yet he will dominate you.\"\n**17** And to Adam he said: \"Because you listened to your wife and ate from the tree I forbade, the ground itself is cursed because of you. You'll work painfully to get food from it all your life.\n**18** It will sprout thorns and thistles for you, and you'll eat wild plants.\n**19** You'll sweat for your bread until you return to the ground you were made from—because you're dust, and to dust you'll return.\"\n**20** The man named his wife Eve (\"Living\"), because she would become the mother of everyone who lives.\n**21** The LORD God made clothing out of animal skins for Adam and his wife and dressed them.\n**22** Then the LORD God said, \"Look, the human has become like one of us, knowing good and evil. We can't let him reach out, take from the tree of life, eat it, and live forever.\"\n**23** So the LORD God sent him out of the garden of Eden to farm the ground he was taken from.\n**24** He drove the human out, and stationed cherubim and a flashing, whirling sword of fire on the east side of Eden to guard the path to the tree of life.\n\n---", "Crossings & Lexical Notes": "- **v. 1 `עָרוּם` (*arum*):** \"Shrewd,\" \"crafty,\" \"prudent\"—a direct wordplay on `עֲרוּמִּים` (*erummim*, \"naked\") in 2:25 and 3:7.\n- **v. 8 `רוּחַ הַיּוֹם` (*ruach ha-yom*):** Literally \"wind/breeze of the day\" (cool evening breeze), or \"spirit of the day.\"\n- **v. 15 `שׁוּף` (*shuph*):** \"Bruise,\" \"crush,\" \"strike.\" Used twice for poetic symmetry—crushing the serpent's head vs. striking the heel.\n- **v. 20 `חַוָּה` (*Chavvah*, Eve):** Connected to `חַי` (*chay*, \"living\").\n\n---", "Supplemental Texts & Allusions": "- **Romans 16:20** (echoes Gen 3:15): *\"The God of peace will soon crush Satan under your feet.\"*\n- **2 Corinthians 11:3** (cites Gen 3:1–6): *\"But I am afraid that as the serpent deceived Eve by his cunning, your thoughts will be led astray...\"*\n- **Revelation 12:9 / 20:2** (identifies the serpent): *\"...that ancient serpent, who is called the devil and Satan, the deceiver of the whole world...\"*\n- **Revelation 22:2, 14** (restores the Tree of Life): *\"Blessed are those who wash their robes, so that they may have the right to the tree of life...\"*"}}, {"id": "genesis-04", "book": "Genesis", "chapter": "4", "title": "Genesis 4", "sections": {"Word-for-Word": "**1** And-the-human knew [object-marker] Eve his-wife, and-she-conceived and-bore [object-marker] Cain *(Qayin)*, and-said: \"I-have-acquired *(qaniti)* a-man with YHWH.\"\n**2** And-she-added to-bear [object-marker] his-brother, [object-marker] Abel *(Havel)*. And-was Abel a-shepherd-of flock, and-Cain was a-worker-of ground *(adamah)*.\n**3** And-it-was from-end-of days, and-brought Cain from-fruit-of the-ground an-offering *(minchah)* to-YHWH.\n**4** And-Abel, he-brought also he from-firstborns-of his-flock and-from-their-fat-portions. And-looked *(sha'ah)* YHWH to Abel and-to his-offering,\n**5** but-to Cain and-to his-offering not he-looked. And-burned *(charah)* to-Cain exceedingly, and-fell his-faces.\n**6** And-said YHWH to Cain: \"Why has-it-burned to-you, and-why have-fallen your-faces?\n**7** If you-do-well, is-there-not lifting-up *(se'et)*? And-if not you-do-well, at-the-door sin *(chattat)* [is] crouching *(rovets)*, and-to-you its-desire, and-you must-rule in-it.\"\n**8** And-said Cain to Abel his-brother... And-it-was in-their-being in-the-field, and-rose-up Cain to Abel his-brother and-killed-him.\n**9** And-said YHWH to Cain: \"Where [is] Abel your-brother?\" And-he-said: \"Not I-know; keeper-of my-brother [am] I?\"\n**10** And-he-said: \"What have-you-done? Voice-of bloods-of *(demei)* your-brother [is] crying-out to-me from the-ground!\n**11** And-now, cursed you from the-ground which opened [object-marker] her-mouth to-receive [object-marker] bloods-of your-brother from-your-hand.\n**12** When you-work [object-marker] the-ground, not it-shall-add to-give its-strength to-you; a-wanderer and-a-fugitive *(na va-nad)* you-shall-be in-the-earth.\"\n**13** And-said Cain to YHWH: \"Greater my-punishment/iniquity *(avon)* than-to-bear.\n**14** Behold, you-have-driven me today from-upon faces-of the-ground, and-from-your-faces I-shall-be-hidden; and-I-shall-be a-wanderer and-a-fugitive in-the-earth, and-it-will-be everyone finding-me will-kill-me.\"\n**15** And-said to-him YHWH: \"Therefore everyone killing Cain, sevenfold it-shall-be-avenged.\" And-set YHWH for-Cain a-sign, lest strike-him everyone finding-him.\n**16** And-went-out Cain from-faces-of YHWH and-dwelt in-land-of Nod *(Wandering)*, east-of Eden.\n**17** And-knew Cain [object-marker] his-wife, and-she-conceived and-bore [object-marker] Enoch. And-he-was building a-city, and-called name-of the-city like-name-of his-son, Enoch.\n**18** And-was-born to-Enoch [object-marker] Irad, and-Irad fathered [object-marker] Mehujael, and-Mehujael fathered [object-marker] Methushael, and-Methushael fathered [object-marker] Lamech.\n**19** And-took for-himself Lamech two wives; name-of the-one Adah, and-name-of the-second Zillah.\n**20** And-bore Adah [object-marker] Jabal; he was father-of dweller-of tent and-livestock.\n**21** And-name-of his-brother Jubal; he was father-of every handler-of lyre and-pipe.\n**22** And-Zillah, also she bore [object-marker] Tubal-cain, forger-of every cutting-tool-of bronze and-iron. And-sister-of Tubal-cain [was] Naamah.\n**23** And-said Lamech to-his-wives: \"Adah and-Zillah, hear my-voice; wives-of Lamech, give-ear to-my-speech: for a-man I-have-killed for-my-wound, and-a-young-man for-my-bruise.\n**24** If sevenfold is-avenged Cain, then-Lamech seventy and-seven.\"\n**25** And-knew Adam again [object-marker] his-wife, and-she-bore a-son, and-called [object-marker] his-name Seth *(Shet)*, \"because appointed *(shat)* for-me God seed another instead-of Abel, for killed-him Cain.\"\n**26** And-to-Seth, also to-him was-born a-son, and-he-called [object-marker] his-name Enosh. Then it-was-begun to-call in-name-of YHWH.\n\n---", "Clear & Faithful": "**1** Now Adam knew Eve his wife, and she conceived and bore Cain, saying, \"I have gotten a man with the help of the LORD.\"\n**2** And again, she bore his brother Abel. Now Abel was a keeper of sheep, and Cain a worker of the ground.\n**3** In the course of time Cain brought to the LORD an offering of the fruit of the ground,\n**4** and Abel also brought of the firstborn of his flock and of their fat portions. And the LORD had regard for Abel and his offering,\n**5** but for Cain and his offering he had no regard. So Cain was very angry, and his face fell.\n**6** The LORD said to Cain, \"Why are you angry, and why has your face fallen?\n**7** If you do l-cain was Naamah.\n**23** Lamech said to his wives: \"Adah and Zillah, hear my voice; you wives of Lamech, listen to what I say: I have killed a man for wounding me, a young man for striking me.\n**24** If Cain's revenge is sevenfold, then Lamech's is seventy-sevenfold.\"\n**25** And Adam knew his wife again, and she bore a son and called his name Seth, for she said, \"God has appointed for me another offspring instead of Abel, for Cain killed him.\"\n**26** To Seth also a son was born, and he called his name Enosh. At that time people began to call upon the name of the LORD.\n\n---", "Everyday English": "**1** Adam slept with his wife Eve, and she became pregnant and gave birth to Cain. She said, \"With the LORD's help, I've brought a man into the world.\"\n**2** Later she gave birth to his brother Abel. Abel became a shepherd, while Cain farmed the land.\n**3** After some time, Cain brought some of his crops as an offering to the LORD.\n**4** Abel also brought an offering—the very best fat portions from the firstborn of his flock. The LORD accepted Abel and his offering,\n**5** but he didn't accept Cain and his offering. Cain was furious, and his face darkened.\n**6** The LORD asked Cain, \"Why are you so angry? Why is your face so downcast?\n**7** If you do what's right, won't you be accepted? But if you don't do what's right, sin is crouching right at your door—it wants to master you, but you have to master it.\"\n**8** Cain talked with his brother Abel, and while they were out in the field, Cain attacked his brother Abel and killed him.\n**9** Then the LORD asked Cain, \"Where is your brother Abel?\" \"I don't know,\" Cain replied. \"Am I supposed to be my brother's babysitter?\"\n**10** God said, \"What have you done? Your brother's blood is crying out to me from the ground!\n**11** Now you're cursed from the very ground that opened its mouth to swallow your brother's blood from your hand.\n**12** When you farm the ground, it won't yield its crops for you anymore. You'll be a restless wanderer on the earth.\"\n**13** Cain said to the LORD, \"My punishment is more than I can bear!\n**14** Look, you're driving me off the land today, and I'll be hidden from your presence. I'll be a restless wanderer on the earth, and anyone who finds me will kill me.\"\n**15** The LORD told him, \"Anyone who kills Cain will face sevenfold vengeance.\" And the LORD put a protective mark on Cain so no one who found him would kill him.\n**16** So Cain left the LORD's presence and settled in the land of Nod (\"Wandering\"), east of Eden.\n**17** Cain slept with his wife, and she became pregnant and gave birth to Enoch. Cain built a city and named it Enoch after his son.\n**18** Enoch was the father of Irad, Irad was the father of Mehujael, Mehujael was the father of Methushael, and Methushael was the father of Lamech.\n**19** Lamech married two women: Adah and Zillah.\n**20** Adah gave birth to Jabal, the ancestor of nomadic herders who live in tents.\n**21** His brother was Jubal, the ancestor of all musicians who play the harp and flute.\n**22** Zillah gave birth to Tubal-cain, who forged all kinds of bronze and iron tools. Tubal-cain's sister was Naamah.\n**23** Lamech boasted to his wives: \"Adah and Zillah, listen to me! Wives of Lamech, hear my words: I killed a man just for wounding me, a young man just for bruising me.\n**24** If Cain is avenged seven times, Lamech will be avenged seventy-seven times!\"\n**25** Adam slept with his wife again, and she gave birth to a son and named him Seth (\"Appointed\"), saying, \"God has given me another child to replace Abel, since Cain killed him.\"\n**26** Seth also had a son, and named him Enosh. That was when people first began to call on the name of the LORD.\n\n---", "Crossings & Lexical Notes": "- **v. 1 `קַיִן` (*Qayin*, Cain) & `קָנִיתִי` (*qaniti*, \"acquired\"):** Wordplay on acquiring/producing.\n- **v. 2 `הֶבֶל` (*Havel*, Abel):** Means \"breath,\" \"vapor,\" or \"fleetingness\" (the same word translated \"vanity/vapor\" in Ecclesiastes).\n- **v. 7 `רֹבֵץ` (*rovets*):** \"Crouching\" (like a predator ready to pounce).\n- **v. 10 `דְּמֵי` (*demei*):** Plural \"bloods\" (literally \"voice of the bloods of your brother\").\n- **v. 13 `עָוֹן` (*avon*):** Spans \"iniquity,\" \"guilt,\" and \"punishment for guilt.\"\n\n---", "Supplemental Texts & Allusions": "- **Hebrews 11:4** (cites Gen 4:4): *\"By faith Abel offered to God a more acceptable sacrifice than Cain, through which he was commended as righteous...\"*\n- **Hebrews 12:24** (contrasts with Gen 4:10): *\"...and to Jesus, the mediator of a new covenant, and to the sprinkled blood that speaks a better word than the blood of Abel.\"*\n- **1 John 3:12** (cites Gen 4:8): *\"We should not be like Cain, who was of the evil one and murdered his brother.\"*\n- **Matthew 18:21–22** (reverses Lamech's 77x vengeance in Gen 4:24): *\"I do not say to you seven times, but seventy-seven times.\"*"}}];
let currentIdx = 0;
let currentReg = 'Clear & Faithful';

function mdToHtml(md) {
  return md
    .split(/\n+/)
    .map(line => {
      line = line.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      line = line.replace(/\*(.+?)\*/g, '<em>$1</em>');
      if (line.startsWith('- ')) return '<li>' + line.slice(2) + '</li>';
      return '<p>' + line + '</p>';
    })
    .join('\n');
}

function render() {
  const ch = CHAPTERS[currentIdx];
  const list = document.getElementById('chapter-list');
  list.innerHTML = CHAPTERS.map((c, i) =>
    `<button class="${i === currentIdx ? 'active' : ''}" onclick="selectChapter(${i})">${c.title}</button>`
  ).join('');

  document.querySelectorAll('#register-bar button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.reg === currentReg);
    btn.onclick = () => { currentReg = btn.dataset.reg; render(); };
  });

  const body = ch.sections[currentReg] || '';
  const crossings = ch.sections['Crossings & Lexical Notes'] || '';
  const supp = ch.sections['Supplemental Texts & Allusions'] || '';

  document.getElementById('content').innerHTML = `
    <h2>${ch.title} — ${currentReg}</h2>
    <div class="verse-block">${mdToHtml(body)}</div>
    <div class="notes">
      ${crossings ? `<h3>Crossings &amp; Lexical Notes</h3><ul>${mdToHtml(crossings)}</ul>` : ''}
      ${supp ? `<h3>Supplemental Texts &amp; Allusions</h3><ul>${mdToHtml(supp)}</ul>` : ''}
    </div>
  `;
}

function selectChapter(i) { currentIdx = i; render(); }
render();
</script>
